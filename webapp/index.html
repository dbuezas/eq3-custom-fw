<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- MOBILE FIRST, and this line is what makes it so. `viewport-fit=cover` plus the safe-area
         insets in index.css keeps controls clear of the notch and the home indicator, because the
         device this drives is on a wall and the phone is held one-handed in front of it.

         `interactive-widget=resizes-content` IS WHAT PUTS A TEXT FIELD ABOVE THE KEYBOARD. By
         default the on-screen keyboard covers the page without resizing it, so a centred dialog
         stays where it was and its input sits behind the keys — measured on the encryption-key and
         the PIN sheets, where the field being typed into could not be seen. With this, the layout
         viewport shrinks to the space left, and everything that centres or scrolls does so within
         it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f14" />
    <!-- APPLE IGNORES THE MANIFEST'S ICONS and uses this link, so an app added to an iPhone's home
         screen from a browser that can reach it needs its own tag. Generated by
         `tools/make_icons.py` along with the rest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>eQ-3 thermostat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
